name: carwash-queue-live

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-carwash_queue}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env.production}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.production}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/patipan26/carwash-queue-api:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN in .env.production}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-carwash_queue}
      DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env.production}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.production}
      DB_CHARSET: utf8mb4
      BOOKING_SLOT_CAPACITY: ${BOOKING_SLOT_CAPACITY:-1}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PROMPTPAY_NUMBER: ${PROMPTPAY_NUMBER:-}
      SLIP2GO_SECRET: ${SLIP2GO_SECRET:-}
      SLIP2GO_RECEIVER_ACCOUNT_TYPE: ${SLIP2GO_RECEIVER_ACCOUNT_TYPE:-02001}
      SLIP2GO_RECEIVER_ACCOUNT_NUMBER: ${SLIP2GO_RECEIVER_ACCOUNT_NUMBER:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  client:
    image: ghcr.io/patipan26/carwash-queue-client:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-16200}:80"

volumes:
  mysql_data:
  uploads_data:
